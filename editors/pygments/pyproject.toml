[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pygments-pyfun"
version = "0.1.0"
description = "A Pygments lexer for Pyfun, the F#-inspired language that compiles to Python"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Simon Treanor" }]
requires-python = ">=3.9"
dependencies = ["pygments>=2.12"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Filters",
    "Topic :: Software Development :: Documentation",
]

[project.urls]
Homepage = "https://github.com/simontreanor/Pyfun"
Source = "https://github.com/simontreanor/Pyfun/tree/main/editors/pygments"

# Pygments finds plugin lexers through this entry point, so `pygmentize -l pyfun`,
# Sphinx and nbconvert pick the lexer up once the package is installed.
[project.entry-points."pygments.lexers"]
pyfun = "pygments_pyfun:PyfunLexer"

[tool.setuptools]
packages = ["pygments_pyfun"]
